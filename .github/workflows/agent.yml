name: Autonomous Agent

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub Issue number for the coding agent to implement
        required: true
        type: string
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve issue number
        id: issue
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Gemini API key
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Missing repository Actions secret GEMINI_API_KEY."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Create agent branch
        id: branch
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          BRANCH="agent/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Build task from GitHub Issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json title,body,url > "$RUNNER_TEMP/issue.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          issue = json.loads(Path(os.environ['RUNNER_TEMP'], 'issue.json').read_text())
          task = f'''# Coding task\n\nImplement GitHub Issue #{os.environ['ISSUE_NUMBER']}.\n\nTitle: {issue['title']}\nURL: {issue['url']}\n\nIssue body:\n{issue.get('body') or ''}\n\nRepository constraints:\n- Work only in this checked-out repository.\n- Do not modify .github/**, .openhands/**, .gemini/**, .gitignore, or src/TiaV21Worker/**.\n- Do not attempt to contact, control, or access the Windows self-hosted runner or TIA Portal directly.\n- Keep Siemens.Engineering dependencies out of the vendor-neutral domain/compiler projects.\n- Inspect the existing implementation before changing it; do not duplicate functionality that already exists.\n- Add or update tests needed to satisfy the issue.\n- Run the relevant dotnet tests and generation checks before finishing.\n- Make the smallest coherent change that satisfies the issue.\n- Do not commit, push, create branches, or open pull requests; the outer workflow owns Git operations.\n'''
          Path(os.environ['RUNNER_TEMP'], 'agent-task.md').write_text(task)
          PY

      - name: Install Gemini CLI
        shell: bash
        run: |
          npm install --global @google/gemini-cli@0.60.0
          gemini --version

      - name: Run Gemini coding agent
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        run: |
          gemini \
            --model gemini-3.8-flash \
            --prompt "$(cat "$RUNNER_TEMP/agent-task.md")" \
            --approval-mode=yolo \
            --skip-trust \
            --extensions none \
            --output-format stream-json \
            | tee "$RUNNER_TEMP/gemini-output.jsonl"

      - name: Capture and validate agent changes
        shell: bash
        run: |
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/agent-changed-files.txt"

          echo "Agent changed files:"
          cat "$RUNNER_TEMP/agent-changed-files.txt"

          if [ ! -s "$RUNNER_TEMP/agent-changed-files.txt" ]; then
            echo "Coding agent finished without repository changes."
            exit 1
          fi

          if grep -E '^(\.github/|\.openhands/|\.gemini/|\.gitignore$|src/TiaV21Worker/)' "$RUNNER_TEMP/agent-changed-files.txt"; then
            echo "Agent changed a protected path. Refusing to publish the branch."
            exit 1
          fi

      - name: Deterministic Linux acceptance
        shell: bash
        run: |
          dotnet test tests/SiemensBackend.Tests/SiemensBackend.Tests.csproj --configuration Release
          rm -rf "$RUNNER_TEMP/generated"
          dotnet run --project src/GeneratorCli/GeneratorCli.csproj --configuration Release -- examples/motor.json "$RUNNER_TEMP/generated"
          test -f "$RUNNER_TEMP/generated/UDT_Motor.scl"

      - name: Verify no protected changes appeared during acceptance
        shell: bash
        run: |
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/final-changed-files.txt"

          if grep -E '^(\.github/|\.openhands/|\.gemini/|\.gitignore$|src/TiaV21Worker/)' "$RUNNER_TEMP/final-changed-files.txt"; then
            echo "Protected path changed. Refusing to publish the branch."
            exit 1
          fi

      - name: Commit and push agent branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "tia-automation-agent"
          git config user.email "tia-automation-agent@users.noreply.github.com"
          git add -A
          git commit -m "Agent: implement issue #${ISSUE_NUMBER}"
          gh auth setup-git
          git push --set-upstream origin "$BRANCH"

      - name: Open pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          TITLE=$(jq -r '.title' "$RUNNER_TEMP/issue.json")
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Automated Gemini CLI implementation for #${ISSUE_NUMBER}.

          The coding agent ran on a disposable GitHub-hosted Linux runner. Protected Windows/TIA integration paths were not permitted to change.

          This pull request was created by an AI coding agent on behalf of the repository owner.

          Closes #${ISSUE_NUMBER}
          EOF

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Agent: #${ISSUE_NUMBER} ${TITLE}" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "$PR_URL"

      - name: Comment on source issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Gemini CLI created a candidate PR: $PR_URL\n\n_This comment was generated by an AI coding agent on behalf of the repository owner._"
