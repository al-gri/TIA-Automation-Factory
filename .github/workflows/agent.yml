name: Autonomous Agent

on:
  workflow_dispatch:
    inputs:
      source:
        description: Work source (task is required for publishable candidates)
        required: true
        default: task
        type: choice
        options: [task, issue]
      task_path:
        description: Versioned JSON task path
        required: false
        default: tasks/OLQ-DIAG-BUILD-001.json
        type: string
      issue_number:
        description: Reserved legacy input; issue-mode publication is disabled
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      base_sha: ${{ steps.context.outputs.base_sha }}
      task_path: ${{ steps.context.outputs.task_path }}
      task_id: ${{ steps.context.outputs.task_id }}
      review_type: ${{ steps.context.outputs.review_type }}
      risk_class: ${{ steps.context.outputs.risk_class }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve immutable trusted task and runtime
        id: context
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
          TASK_PATH: ${{ inputs.task_path }}
        run: |
          set -euo pipefail
          test "$SOURCE" = "task" || {
            echo "Autonomous publication requires a trusted versioned task. Issue-mode publication is disabled."
            exit 1
          }
          case "$TASK_PATH" in tasks/*.json) ;; *) echo "task_path must be tasks/*.json"; exit 1 ;; esac
          BASE_SHA=$(git rev-parse HEAD)
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git show "$BASE_SHA:$TASK_PATH" > "$RUNNER_TEMP/task.json"
          jq -e '.id and .acceptance.requirements and .acceptance.tia and .review.riskClass and .review.reviewType and (.candidatePolicy.allowedPaths | type == "array" and length > 0)' "$RUNNER_TEMP/task.json" >/dev/null

          mkdir -p "$RUNNER_TEMP/trusted-runtime"
          for path in agents/runtime/run-coder.sh agents/runtime/build-coder-context.py agents/runtime/candidate-patch.py; do
            git show "$BASE_SHA:$path" > "$RUNNER_TEMP/trusted-runtime/$(basename "$path")"
          done
          chmod +x "$RUNNER_TEMP/trusted-runtime/run-coder.sh" "$RUNNER_TEMP/trusted-runtime/candidate-patch.py"
          cp "$RUNNER_TEMP/trusted-runtime/build-coder-context.py" agents/runtime/build-coder-context.py

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "task_path=$TASK_PATH" >> "$GITHUB_OUTPUT"
          echo "task_id=$(jq -r .id "$RUNNER_TEMP/task.json")" >> "$GITHUB_OUTPUT"
          echo "review_type=$(jq -r .review.reviewType "$RUNNER_TEMP/task.json")" >> "$GITHUB_OUTPUT"
          echo "risk_class=$(jq -r .review.riskClass "$RUNNER_TEMP/task.json")" >> "$GITHUB_OUTPUT"

      - name: Build bounded coding prompt
        shell: bash
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:agents/prompts/coder.md" > "$RUNNER_TEMP/agent-task.md"
          {
            echo
            echo '# Current versioned task'
            echo '```json'
            cat "$RUNNER_TEMP/task.json"
            echo '```'
          } >> "$RUNNER_TEMP/agent-task.md"

      - name: Require at least one coding provider
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ] && [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "Configure OPENROUTER_API_KEY and/or DEEPSEEK_API_KEY."
            exit 1
          fi

      - name: Install coding runtime
        shell: bash
        run: |
          npm install --global opencode-ai@1.18.31
          opencode --version
          opencode models deepseek | grep -F 'deepseek/deepseek-flash'

      - name: Run coding agent without publication authority
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          OPENROUTER_TIMEOUT_MINUTES: '30'
          DEEPSEEK_MODEL: deepseek-flash
          DEEPSEEK_TIMEOUT_MINUTES: '30'
          CODER_TRUSTED_GIT_REF: ${{ steps.context.outputs.base_sha }}
          CODER_TRUSTED_TASK_PATH: ${{ steps.context.outputs.task_path }}
        run: |
          bash "$RUNNER_TEMP/trusted-runtime/run-coder.sh" \
            "$RUNNER_TEMP/agent-task.md" \
            "$RUNNER_TEMP/coder-provider-audit.json"

      - name: Restore trusted helper path after candidate execution
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:agents/runtime/build-coder-context.py" > agents/runtime/build-coder-context.py

      - name: Deterministic Linux acceptance
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/SiemensBackend.Tests/SiemensBackend.Tests.csproj --configuration Release
          rm -rf "$RUNNER_TEMP/motor-generated"
          dotnet run --project src/GeneratorCli/GeneratorCli.csproj --configuration Release -- examples/motor.json "$RUNNER_TEMP/motor-generated"
          test -f "$RUNNER_TEMP/motor-generated/UDT_Motor.scl"

          INPUT=$(jq -r '.generator.input // empty' "$RUNNER_TEMP/task.json")
          EXPECTED=$(jq -r '.generator.expectedArtifact // empty' "$RUNNER_TEMP/task.json")
          if [ -n "$INPUT" ] && [ -n "$EXPECTED" ]; then
            rm -rf "$RUNNER_TEMP/candidate-generated"
            dotnet run --project src/GeneratorCli/GeneratorCli.csproj --configuration Release -- "$INPUT" "$RUNNER_TEMP/candidate-generated"
            test -f "$RUNNER_TEMP/candidate-generated/$EXPECTED"
          fi

      - name: Prepare bounded candidate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/trusted-runtime/candidate-patch.py" prepare \
            --task "$RUNNER_TEMP/task.json" \
            --patch "$RUNNER_TEMP/candidate.patch" \
            --manifest "$RUNNER_TEMP/candidate-patch-manifest.json"
          cat "$RUNNER_TEMP/candidate-patch-manifest.json"

      - name: Upload bounded candidate data
        uses: actions/upload-artifact@v4
        with:
          name: candidate-patch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/candidate-patch-manifest.json
            ${{ runner.temp }}/coder-provider-audit.json
          if-no-files-found: error

  publish:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Fresh trusted checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.implement.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate patch data only
        uses: actions/download-artifact@v4
        with:
          name: candidate-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-patch

      - name: Resolve trusted publication policy
        shell: bash
        env:
          BASE_SHA: ${{ needs.implement.outputs.base_sha }}
          TASK_PATH: ${{ needs.implement.outputs.task_path }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git show "$BASE_SHA:$TASK_PATH" > "$RUNNER_TEMP/task.json"
          git show "$BASE_SHA:agents/runtime/candidate-patch.py" > "$RUNNER_TEMP/trusted-candidate-patch.py"
          chmod +x "$RUNNER_TEMP/trusted-candidate-patch.py"

      - name: Validate and stage bounded patch in clean publisher
        shell: bash
        env:
          BASE_SHA: ${{ needs.implement.outputs.base_sha }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/trusted-candidate-patch.py" apply \
            --task "$RUNNER_TEMP/task.json" \
            --patch "$RUNNER_TEMP/candidate-patch/candidate.patch" \
            --manifest "$RUNNER_TEMP/candidate-patch/candidate-patch-manifest.json" \
            --expected-head "$BASE_SHA" \
            --scope-base "$BASE_SHA"

      - name: Commit and push from clean publisher
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.implement.outputs.task_id }}
        run: |
          set -euo pipefail
          SAFE_ID=$(printf '%s' "$TASK_ID" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')
          BRANCH="agent/task-${SAFE_ID}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name "tia-automation-agent"
          git config user.email "tia-automation-agent@users.noreply.github.com"
          git commit -m "Agent: implement task-${TASK_ID}"
          CANDIDATE_SHA=$(git rev-parse HEAD)
          gh auth setup-git
          git push --set-upstream origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Open candidate PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.implement.outputs.task_id }}
          TASK_PATH: ${{ needs.implement.outputs.task_path }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        run: |
          set -euo pipefail
          TITLE=$(jq -r .title "$RUNNER_TEMP/task.json")
          PROVIDER_AUDIT=$(jq -c . "$RUNNER_TEMP/candidate-patch/coder-provider-audit.json")
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Automated coding-agent candidate for task \`${TASK_ID}\`.

          Task: \`${TASK_PATH}\`

          Candidate implementation/tests ran in a read-only publication context. This PR was created by a fresh publisher that applied only a positively authorized bounded patch and did not execute candidate code.

          Provider/model audit:
          \`${PROVIDER_AUDIT}\`
          EOF
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "Agent: task-${TASK_ID} ${TITLE}" --body-file "$RUNNER_TEMP/pr-body.md")
          PR_NUMBER=$(gh pr view "$BRANCH" --json number --jq .number)
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "$PR_URL"

      - name: Dispatch exact-SHA external review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
          TASK_PATH: ${{ needs.implement.outputs.task_path }}
          REVIEW_TYPE: ${{ needs.implement.outputs.review_type }}
          RISK_CLASS: ${{ needs.implement.outputs.risk_class }}
        run: |
          set -euo pipefail
          git show "${{ needs.implement.outputs.base_sha }}:agents/runtime/reviewer-policy.py" > "$RUNNER_TEMP/trusted-reviewer-policy.py"
          git log -1 --format='%ae' "$CANDIDATE_SHA" > "$RUNNER_TEMP/candidate-author-emails.txt"
          SLOT=chatgpt
          python3 "$RUNNER_TEMP/trusted-reviewer-policy.py" validate-slot --emails-file "$RUNNER_TEMP/candidate-author-emails.txt" --reviewer-slot "$SLOT"
          if ! python3 "$RUNNER_TEMP/trusted-reviewer-policy.py" authorize-slot --task-file "$RUNNER_TEMP/task.json" --reviewer-slot "$SLOT"; then
            echo "Trusted task does not authorize the primary reviewer slot required for a pure coding-agent candidate"
            exit 1
          fi
          REVIEWER_SLOT="$SLOT"
          jq -n \
            --argjson pr "$PR_NUMBER" \
            --arg task_path "$TASK_PATH" \
            --arg review_type "$REVIEW_TYPE" \
            --arg risk_class "$RISK_CLASS" \
            --arg reviewer_slot "$REVIEWER_SLOT" \
            '{event_type:"external-review-request",client_payload:{pr_number:$pr,task_path:$task_path,review_type:$review_type,risk_class:$risk_class,reviewer_slot:$reviewer_slot,review_round:1}}' \
            > "$RUNNER_TEMP/review-dispatch.json"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input "$RUNNER_TEMP/review-dispatch.json"
