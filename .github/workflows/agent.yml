name: Autonomous Agent

on:
  workflow_dispatch:
    inputs:
      source:
        description: Work source
        required: true
        default: task
        type: choice
        options:
          - task
          - issue
      task_path:
        description: Versioned JSON task path when source=task
        required: false
        default: tasks/INFRA-001.json
        type: string
      issue_number:
        description: GitHub Issue number when source=issue
        required: false
        default: ''
        type: string
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Require at least one coding provider
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ] && [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "Configure OPENROUTER_API_KEY and/or DEEPSEEK_API_KEY as repository Actions secrets."
            exit 1
          fi

      - name: Resolve work source
        id: work
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE: ${{ inputs.source }}
          DISPATCH_TASK_PATH: ${{ inputs.task_path }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          ALLOW_TIA_WORKER=false
          if [ "$EVENT_NAME" = "issues" ]; then
            MODE="issue"
            ISSUE_NUMBER="$EVENT_ISSUE"
            KEY="issue-${ISSUE_NUMBER}"
            TASK_PATH=""
          elif [ "$DISPATCH_SOURCE" = "issue" ]; then
            MODE="issue"
            ISSUE_NUMBER="$DISPATCH_ISSUE"
            if [ -z "$ISSUE_NUMBER" ]; then
              echo "source=issue requires issue_number"
              exit 1
            fi
            KEY="issue-${ISSUE_NUMBER}"
            TASK_PATH=""
          else
            MODE="task"
            ISSUE_NUMBER=""
            TASK_PATH="$DISPATCH_TASK_PATH"
            case "$TASK_PATH" in
              tasks/*.json) ;;
              *) echo "task_path must be under tasks/ and end in .json"; exit 1 ;;
            esac
            if [ ! -f "$TASK_PATH" ]; then
              echo "Task file not found: $TASK_PATH"
              exit 1
            fi
            jq -e '.id and .title and .acceptance.requirements and .acceptance.tia and .review.riskClass and .review.reviewType' "$TASK_PATH" >/dev/null
            if jq -e 'has("generator") and ((.generator.input // "") == "" or (.generator.expectedArtifact // "") == "")' "$TASK_PATH" >/dev/null; then
              echo "generator, when present, requires both input and expectedArtifact"
              exit 1
            fi
            ALLOW_TIA_WORKER=$(jq -r '.candidatePolicy.allowTiaV21WorkerChanges // false' "$TASK_PATH")
            case "$ALLOW_TIA_WORKER" in true|false) ;; *) echo "candidatePolicy.allowTiaV21WorkerChanges must be boolean"; exit 1 ;; esac
            TASK_ID=$(jq -r '.id' "$TASK_PATH")
            KEY="task-${TASK_ID}"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "task_path=$TASK_PATH" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "allow_tia_worker=$ALLOW_TIA_WORKER" >> "$GITHUB_OUTPUT"

      - name: Create agent branch
        id: branch
        shell: bash
        env:
          WORK_KEY: ${{ steps.work.outputs.key }}
        run: |
          SAFE_KEY=$(printf '%s' "$WORK_KEY" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')
          BRANCH="agent/${SAFE_KEY}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Build agent task from Git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.work.outputs.mode }}
          TASK_PATH: ${{ steps.work.outputs.task_path }}
          ISSUE_NUMBER: ${{ steps.work.outputs.issue_number }}
        run: |
          test -f agents/prompts/coder.md
          cp agents/prompts/coder.md "$RUNNER_TEMP/agent-task.md"

          if [ "$MODE" = "task" ]; then
            {
              echo
              echo "# Current versioned task"
              echo
              echo '```json'
              cat "$TASK_PATH"
              echo
              echo '```'
            } >> "$RUNNER_TEMP/agent-task.md"
          else
            gh issue view "$ISSUE_NUMBER" --json title,body,url > "$RUNNER_TEMP/issue.json"
            {
              echo
              echo "# Current GitHub Issue"
              echo
              jq -r '"Issue: " + .url + "\nTitle: " + .title + "\n\n" + (.body // "")' "$RUNNER_TEMP/issue.json"
            } >> "$RUNNER_TEMP/agent-task.md"
          fi

      - name: Install coding runtime
        shell: bash
        run: |
          npm install --global opencode-ai@1.18.31
          opencode --version
          opencode models deepseek | grep -F 'deepseek/deepseek-flash'

      - name: Run coding agent with provider fallback
        id: agent
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          OPENROUTER_TIMEOUT_MINUTES: '30'
          DEEPSEEK_MODEL: deepseek-flash
          DEEPSEEK_TIMEOUT_MINUTES: '30'
        run: |
          bash agents/runtime/run-coder.sh \
            "$RUNNER_TEMP/agent-task.md" \
            "$RUNNER_TEMP/coder-provider-audit.json"

      - name: Record provider and model audit
        id: model
        if: always()
        shell: bash
        run: |
          AUDIT="$RUNNER_TEMP/coder-provider-audit.json"
          if [ ! -f "$AUDIT" ]; then
            echo '{"selected_provider":null,"selected_model":null,"error":"audit missing"}' > "$AUDIT"
          fi
          cat "$AUDIT"
          COMPACT=$(jq -c . "$AUDIT")
          SELECTED_PROVIDER=$(jq -r '.selected_provider // "none"' "$AUDIT")
          SELECTED_MODEL=$(jq -r '.selected_model // "none"' "$AUDIT")
          OPENROUTER_COST=$(jq -r '.openrouter.usage.reported_cost_usd // 0' "$AUDIT")
          OPENROUTER_INPUT=$(jq -r '.openrouter.usage.input_tokens // 0' "$AUDIT")
          OPENROUTER_OUTPUT=$(jq -r '.openrouter.usage.output_tokens // 0' "$AUDIT")
          DEEPSEEK_COST=$(jq -r '.deepseek.usage.reported_cost_usd // 0' "$AUDIT")
          DEEPSEEK_INPUT=$(jq -r '.deepseek.usage.input_tokens // 0' "$AUDIT")
          DEEPSEEK_OUTPUT=$(jq -r '.deepseek.usage.output_tokens // 0' "$AUDIT")
          echo "audit=$COMPACT" >> "$GITHUB_OUTPUT"
          echo "provider=$SELECTED_PROVIDER" >> "$GITHUB_OUTPUT"
          echo "model=$SELECTED_MODEL" >> "$GITHUB_OUTPUT"
          {
            echo '### Coding provider audit'
            echo
            echo "- Selected provider: \`$SELECTED_PROVIDER\`"
            echo "- Selected model: \`$SELECTED_MODEL\`"
            echo "- OpenRouter reported cost: \`\$${OPENROUTER_COST}\`"
            echo "- OpenRouter input/output tokens: \`${OPENROUTER_INPUT}/${OPENROUTER_OUTPUT}\`"
            echo "- DeepSeek reported cost: \`\$${DEEPSEEK_COST}\`"
            echo "- DeepSeek input/output tokens: \`${DEEPSEEK_INPUT}/${DEEPSEEK_OUTPUT}\`"
            echo
            echo '```json'
            cat "$AUDIT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture and validate agent changes
        shell: bash
        env:
          ALLOW_TIA_WORKER: ${{ steps.work.outputs.allow_tia_worker }}
        run: |
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/agent-changed-files.txt"

          echo "Agent changed files:"
          cat "$RUNNER_TEMP/agent-changed-files.txt"

          if [ ! -s "$RUNNER_TEMP/agent-changed-files.txt" ]; then
            echo "Coding agent finished without repository changes."
            exit 1
          fi

          if grep -E '^(\.github/|agents/|tasks/|\.openhands/|\.gemini/|\.gitignore$|opencode\.json$)' "$RUNNER_TEMP/agent-changed-files.txt"; then
            echo "Agent changed protected infrastructure. Refusing to publish the branch."
            exit 1
          fi
          if grep -E '^src/TiaV21Worker/' "$RUNNER_TEMP/agent-changed-files.txt" && [ "$ALLOW_TIA_WORKER" != "true" ]; then
            echo "Agent changed src/TiaV21Worker without trusted task opt-in."
            exit 1
          fi

      - name: Deterministic Linux acceptance
        shell: bash
        env:
          MODE: ${{ steps.work.outputs.mode }}
          TASK_PATH: ${{ steps.work.outputs.task_path }}
        run: |
          dotnet test tests/SiemensBackend.Tests/SiemensBackend.Tests.csproj --configuration Release

          rm -rf "$RUNNER_TEMP/motor-generated"
          dotnet run --project src/GeneratorCli/GeneratorCli.csproj --configuration Release -- examples/motor.json "$RUNNER_TEMP/motor-generated"
          test -f "$RUNNER_TEMP/motor-generated/UDT_Motor.scl"

          if [ "$MODE" = "task" ]; then
            INPUT=$(jq -r '.generator.input // empty' "$TASK_PATH")
            EXPECTED=$(jq -r '.generator.expectedArtifact // empty' "$TASK_PATH")
            if [ -n "$INPUT" ] && [ -n "$EXPECTED" ]; then
              test -f "$INPUT"
              rm -rf "$RUNNER_TEMP/candidate-generated"
              dotnet run --project src/GeneratorCli/GeneratorCli.csproj --configuration Release -- "$INPUT" "$RUNNER_TEMP/candidate-generated"
              test -f "$RUNNER_TEMP/candidate-generated/$EXPECTED"
              echo "Generated candidate artifact: $EXPECTED"
            fi
          fi

      - name: Verify no protected changes appeared during acceptance
        shell: bash
        env:
          ALLOW_TIA_WORKER: ${{ steps.work.outputs.allow_tia_worker }}
        run: |
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/final-changed-files.txt"

          if grep -E '^(\.github/|agents/|tasks/|\.openhands/|\.gemini/|\.gitignore$|opencode\.json$)' "$RUNNER_TEMP/final-changed-files.txt"; then
            echo "Protected infrastructure changed. Refusing to publish the branch."
            exit 1
          fi
          if grep -E '^src/TiaV21Worker/' "$RUNNER_TEMP/final-changed-files.txt" && [ "$ALLOW_TIA_WORKER" != "true" ]; then
            echo "src/TiaV21Worker changed without trusted task opt-in."
            exit 1
          fi

      - name: Commit and push agent branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORK_KEY: ${{ steps.work.outputs.key }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "tia-automation-agent"
          git config user.email "tia-automation-agent@users.noreply.github.com"
          git add -A
          git commit -m "Agent: implement ${WORK_KEY}"
          gh auth setup-git
          git push --set-upstream origin "$BRANCH"

      - name: Open pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.work.outputs.mode }}
          TASK_PATH: ${{ steps.work.outputs.task_path }}
          ISSUE_NUMBER: ${{ steps.work.outputs.issue_number }}
          WORK_KEY: ${{ steps.work.outputs.key }}
          BRANCH: ${{ steps.branch.outputs.name }}
          PROVIDER_AUDIT: ${{ steps.model.outputs.audit }}
          ALLOW_TIA_WORKER: ${{ steps.work.outputs.allow_tia_worker }}
        run: |
          if [ "$MODE" = "task" ]; then
            TITLE=$(jq -r '.title' "$TASK_PATH")
            CLOSES_LINE=""
            SOURCE_LINE="Task: \`$TASK_PATH\`"
          else
            TITLE=$(jq -r '.title' "$RUNNER_TEMP/issue.json")
            CLOSES_LINE="Closes #${ISSUE_NUMBER}"
            SOURCE_LINE="Issue: #${ISSUE_NUMBER}"
          fi

          TIA_POLICY_LINE="TiaV21Worker candidate changes were not permitted."
          if [ "$ALLOW_TIA_WORKER" = "true" ]; then
            TIA_POLICY_LINE="The trusted task explicitly permits bounded src/TiaV21Worker changes. Candidate code still executes only on disposable Linux; Windows/TIA execution requires trusted main."
          fi

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Automated coding-agent candidate for ${WORK_KEY}.

          ${SOURCE_LINE}

          Agent execution environment: disposable GitHub-hosted Linux runner. Protected orchestration paths were not permitted to change. ${TIA_POLICY_LINE}

          Provider/model audit:
          \`${PROVIDER_AUDIT}\`

          ${CLOSES_LINE}
          EOF

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Agent: ${WORK_KEY} ${TITLE}" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          PR_NUMBER=$(gh pr view "$BRANCH" --json number --jq '.number')
          CANDIDATE_SHA=$(git rev-parse HEAD)
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "$PR_URL"

      - name: Dispatch external review before trusted candidate validation
        if: steps.work.outputs.mode == 'task'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          TASK_PATH: ${{ steps.work.outputs.task_path }}
        run: |
          set -euo pipefail
          REVIEW_TYPE=$(jq -r '.review.reviewType // "CODE_REVIEW"' "$TASK_PATH")
          RISK_CLASS=$(jq -r '.review.riskClass // "LOW"' "$TASK_PATH")
          case "$REVIEW_TYPE" in CODE_REVIEW|PLC_REVIEW) ;; *) echo "Invalid review.reviewType=$REVIEW_TYPE"; exit 1 ;; esac
          case "$RISK_CLASS" in LOW|MEDIUM|HIGH) ;; *) echo "Invalid review.riskClass=$RISK_CLASS"; exit 1 ;; esac

          SLOT=chatgpt
          if jq -e '.review.reviewerSlots | type == "array" and length > 0' "$TASK_PATH" >/dev/null 2>&1; then
            jq -e --arg slot "$SLOT" '.review.reviewerSlots | index($slot) != null' "$TASK_PATH" >/dev/null || {
              echo "Trusted task does not authorize the primary reviewer slot required for a pure coding-agent candidate: $SLOT"
              exit 1
            }
          fi

          jq -n \
            --argjson pr "$PR_NUMBER" \
            --arg task_path "$TASK_PATH" \
            --arg review_type "$REVIEW_TYPE" \
            --arg risk_class "$RISK_CLASS" \
            --arg reviewer_slot "$SLOT" \
            '{event_type:"external-review-request",client_payload:{pr_number:$pr,task_path:$task_path,review_type:$review_type,risk_class:$risk_class,reviewer_slot:$reviewer_slot,review_round:1}}' \
            > "$RUNNER_TEMP/external-review-${SLOT}.json"
          cat "$RUNNER_TEMP/external-review-${SLOT}.json"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input "$RUNNER_TEMP/external-review-${SLOT}.json"

      - name: Comment on source issue
        if: steps.work.outputs.mode == 'issue'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.work.outputs.issue_number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Coding agent created a candidate PR: $PR_URL\n\n_This comment was generated by an AI coding agent on behalf of the repository owner._"
