name: Autonomous Repair

on:
  repository_dispatch:
    types: [candidate-repair]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: repair-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  repair:
    if: startsWith(github.event.client_payload.branch, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Validate repair context
        id: context
        shell: bash
        env:
          BRANCH: ${{ github.event.client_payload.branch }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          TASK_PATH: ${{ github.event.client_payload.task_path }}
          CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
          VALIDATION_RUN_ID: ${{ github.event.client_payload.validation_run_id }}
          ATTEMPT: ${{ github.event.client_payload.attempt }}
          REVIEW_SOURCE: ${{ github.event.client_payload.review_source }}
          REVIEW_TYPE: ${{ github.event.client_payload.review_type }}
          RISK_CLASS: ${{ github.event.client_payload.risk_class }}
          REVIEWER_SLOT: ${{ github.event.client_payload.reviewer_slot }}
        run: |
          set -euo pipefail
          VALIDATION_RUN_ID="${VALIDATION_RUN_ID:-0}"
          REVIEW_SOURCE="${REVIEW_SOURCE:-}"
          case "$BRANCH" in agent/*) ;; *) echo "Invalid repair branch: $BRANCH"; exit 1 ;; esac
          case "$TASK_PATH" in tasks/*.json) ;; *) echo "Invalid task path: $TASK_PATH"; exit 1 ;; esac
          test "$REVIEW_SOURCE" = "external-review" || { echo "All candidate-changing repairs require external-review provenance."; exit 1; }
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$VALIDATION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          git fetch origin main "$BRANCH"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git show "origin/main:$TASK_PATH" > "$RUNNER_TEMP/task.json"
          jq -e '.id and .acceptance.requirements and .acceptance.tia and .review.riskClass and .review.reviewType and .maxRepairAttempts' "$RUNNER_TEMP/task.json" >/dev/null
          if jq -e 'has("generator") and ((.generator.input // "") == "" or (.generator.expectedArtifact // "") == "")' "$RUNNER_TEMP/task.json" >/dev/null; then
            echo "generator, when present, requires both input and expectedArtifact"
            exit 1
          fi

          TASK_RISK=$(jq -r '.review.riskClass' "$RUNNER_TEMP/task.json")
          TASK_REVIEW_TYPE=$(jq -r '.review.reviewType' "$RUNNER_TEMP/task.json")
          case "$TASK_RISK" in LOW|MEDIUM|HIGH) ;; *) echo "Invalid trusted task risk class: $TASK_RISK"; exit 1 ;; esac
          case "$TASK_REVIEW_TYPE" in CODE_REVIEW|PLC_REVIEW) ;; *) echo "Invalid trusted task review type: $TASK_REVIEW_TYPE"; exit 1 ;; esac
          test "$TASK_RISK" = "$RISK_CLASS"
          test "$TASK_REVIEW_TYPE" = "$REVIEW_TYPE"
          [[ "$REVIEWER_SLOT" =~ ^[A-Za-z0-9._-]+$ ]]
          python3 agents/runtime/reviewer-policy.py authorize-slot \
            --task-file "$RUNNER_TEMP/task.json" \
            --reviewer-slot "$REVIEWER_SLOT"

          ALLOW_TIA_WORKER=$(jq -r '.candidatePolicy.allowTiaV21WorkerChanges // false' "$RUNNER_TEMP/task.json")
          case "$ALLOW_TIA_WORKER" in true|false) ;; *) echo "candidatePolicy.allowTiaV21WorkerChanges must be boolean"; exit 1 ;; esac

          MAX_ATTEMPTS=$(jq -r '.maxRepairAttempts' "$RUNNER_TEMP/task.json")
          [[ "$MAX_ATTEMPTS" =~ ^[0-9]+$ ]]
          if [ "$ATTEMPT" -gt "$MAX_ATTEMPTS" ]; then
            echo "Repair attempt $ATTEMPT exceeds maxRepairAttempts=$MAX_ATTEMPTS"
            exit 1
          fi

          git diff --name-only origin/main...HEAD | sort -u > "$RUNNER_TEMP/current-candidate-files.txt"
          if grep -E '^(\.github/|agents/|tasks/|\.openhands/|\.gemini/|\.gitignore$|opencode\.json$)' "$RUNNER_TEMP/current-candidate-files.txt"; then
            echo "Existing candidate contains protected infrastructure changes. Refusing repair."
            exit 1
          fi
          if grep -E '^src/TiaV21Worker/' "$RUNNER_TEMP/current-candidate-files.txt" && [ "$ALLOW_TIA_WORKER" != "true" ]; then
            echo "Existing candidate changes src/TiaV21Worker without trusted task opt-in."
            exit 1
          fi

          echo "before_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "max_attempts=$MAX_ATTEMPTS" >> "$GITHUB_OUTPUT"
          echo "validation_run_id=$VALIDATION_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "review_source=$REVIEW_SOURCE" >> "$GITHUB_OUTPUT"
          echo "allow_tia_worker=$ALLOW_TIA_WORKER" >> "$GITHUB_OUTPUT"

      - name: Require at least one coding provider
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ] && [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "Configure OPENROUTER_API_KEY and/or DEEPSEEK_API_KEY."
            exit 1
          fi

      - name: Collect previous review evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          VALIDATION_RUN_ID: ${{ steps.context.outputs.validation_run_id }}
        run: |
          set +e
          gh pr view "$PR_NUMBER" --json comments --jq '.comments[-8:][] | .body' > "$RUNNER_TEMP/reviewer-comments.txt"
          : > "$RUNNER_TEMP/failed-validation.log"
          mkdir -p "$RUNNER_TEMP/previous-tia"
          if [ "$VALIDATION_RUN_ID" != "0" ]; then
            gh run view "$VALIDATION_RUN_ID" --log-failed > "$RUNNER_TEMP/failed-validation.log" 2>&1
            gh run download "$VALIDATION_RUN_ID" \
              --name "tia-candidate-diagnostics-${VALIDATION_RUN_ID}" \
              --dir "$RUNNER_TEMP/previous-tia" >/dev/null 2>&1
          fi
          set -e
          test -f "$RUNNER_TEMP/reviewer-comments.txt" || : > "$RUNNER_TEMP/reviewer-comments.txt"

      - name: Build repair prompt from trusted Git state
        shell: bash
        env:
          ATTEMPT: ${{ github.event.client_payload.attempt }}
          MAX_ATTEMPTS: ${{ steps.context.outputs.max_attempts }}
          REVIEW_SOURCE: ${{ steps.context.outputs.review_source }}
        run: |
          git show origin/main:agents/prompts/coder.md > "$RUNNER_TEMP/repair-task.md"
          printf '\n\n' >> "$RUNNER_TEMP/repair-task.md"
          git show origin/main:agents/prompts/repair.md >> "$RUNNER_TEMP/repair-task.md"
          git diff --no-ext-diff --unified=80 origin/main...HEAD > "$RUNNER_TEMP/current-candidate.diff"

          {
            echo
            echo '# Repair state'
            echo "Repair source: $REVIEW_SOURCE"
            echo "Repair attempt: $ATTEMPT of $MAX_ATTEMPTS"
            echo
            echo '# Trusted task specification'
            echo '```json'
            cat "$RUNNER_TEMP/task.json"
            echo '```'
            echo
            echo '# Current candidate diff'
            echo '```diff'
            cat "$RUNNER_TEMP/current-candidate.diff"
            echo '```'
            echo
            echo '# Recent reviewer comments'
            cat "$RUNNER_TEMP/reviewer-comments.txt"
            echo
            echo '# Failed validation logs'
            if [ -s "$RUNNER_TEMP/failed-validation.log" ]; then cat "$RUNNER_TEMP/failed-validation.log"; else echo 'No validation-run failure log for this repair source.'; fi
            echo
            echo '# Previous TIA diagnostics'
            if [ -f "$RUNNER_TEMP/previous-tia/tia-diagnostics.json" ]; then
              cat "$RUNNER_TEMP/previous-tia/tia-diagnostics.json"
            else
              echo 'No TIA diagnostics were produced before this repair.'
            fi
          } >> "$RUNNER_TEMP/repair-task.md"

      - name: Install coding runtime
        shell: bash
        run: |
          npm install --global opencode-ai@1.18.31
          opencode --version
          opencode models deepseek | grep -F 'deepseek/deepseek-flash'

      - name: Run repair agent with provider fallback
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          OPENROUTER_TIMEOUT_MINUTES: '30'
          DEEPSEEK_MODEL: deepseek-flash
          DEEPSEEK_TIMEOUT_MINUTES: '30'
        run: |
          bash agents/runtime/run-coder.sh \
            "$RUNNER_TEMP/repair-task.md" \
            "$RUNNER_TEMP/repair-provider-audit.json"

      - name: Validate repair changes
        shell: bash
        env:
          BEFORE_SHA: ${{ steps.context.outputs.before_sha }}
          ALLOW_TIA_WORKER: ${{ steps.context.outputs.allow_tia_worker }}
        run: |
          {
            git diff --name-only "$BEFORE_SHA"
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/repair-changed-files.txt"

          echo "Repair changed files:"
          cat "$RUNNER_TEMP/repair-changed-files.txt"

          if [ ! -s "$RUNNER_TEMP/repair-changed-files.txt" ]; then
            echo "Repair agent produced no repository changes."
            exit 1
          fi

          if grep -E '^(\.github/|agents/|tasks/|\.openhands/|\.gemini/|\.gitignore$|opencode\.json$)' "$RUNNER_TEMP/repair-changed-files.txt"; then
            echo "Repair agent changed protected infrastructure."
            exit 1
          fi
          if grep -E '^src/TiaV21Worker/' "$RUNNER_TEMP/repair-changed-files.txt" && [ "$ALLOW_TIA_WORKER" != "true" ]; then
            echo "Repair agent changed src/TiaV21Worker without trusted task opt-in."
            exit 1
          fi

      - name: Deterministic Linux acceptance after repair
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/SiemensBackend.Tests/SiemensBackend.Tests.csproj --configuration Release

          rm -rf "$RUNNER_TEMP/motor-generated"
          dotnet run --project src/GeneratorCli/GeneratorCli.csproj --configuration Release -- examples/motor.json "$RUNNER_TEMP/motor-generated"
          test -f "$RUNNER_TEMP/motor-generated/UDT_Motor.scl"

          INPUT=$(jq -r '.generator.input // empty' "$RUNNER_TEMP/task.json")
          EXPECTED=$(jq -r '.generator.expectedArtifact // empty' "$RUNNER_TEMP/task.json")
          if [ -n "$INPUT" ] && [ -n "$EXPECTED" ]; then
            test -f "$INPUT"
            rm -rf "$RUNNER_TEMP/repaired-generated"
            dotnet run --project src/GeneratorCli/GeneratorCli.csproj --configuration Release -- "$INPUT" "$RUNNER_TEMP/repaired-generated"
            test -f "$RUNNER_TEMP/repaired-generated/$EXPECTED"
          else
            echo "No GeneratorCli task artifact declared; source/diff plus baseline Linux regression evidence is authoritative pre-merge evidence for this task."
          fi

      - name: Commit and push repair to same candidate branch
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.client_payload.branch }}
          ATTEMPT: ${{ github.event.client_payload.attempt }}
        run: |
          TASK_ID=$(jq -r '.id' "$RUNNER_TEMP/task.json")
          git config user.name "tia-automation-agent"
          git config user.email "tia-automation-agent@users.noreply.github.com"
          git add -A
          git commit -m "Agent: repair ${TASK_ID} attempt ${ATTEMPT}"
          gh auth setup-git
          git push origin "HEAD:$BRANCH"
          NEW_SHA=$(git rev-parse HEAD)
          echo "candidate_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

      - name: Comment repair attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          ATTEMPT: ${{ github.event.client_payload.attempt }}
          MAX_ATTEMPTS: ${{ steps.context.outputs.max_attempts }}
        run: |
          PROVIDER=$(jq -r '.selected_provider // "unknown"' "$RUNNER_TEMP/repair-provider-audit.json")
          MODEL=$(jq -r '.selected_model // "unknown"' "$RUNNER_TEMP/repair-provider-audit.json")
          OPENROUTER_COST=$(jq -r '.openrouter.usage.reported_cost_usd // 0' "$RUNNER_TEMP/repair-provider-audit.json")
          DEEPSEEK_COST=$(jq -r '.deepseek.usage.reported_cost_usd // 0' "$RUNNER_TEMP/repair-provider-audit.json")
          NEXT_TEXT="A fresh external review package will be generated for the repaired candidate before any further Candidate Validation."
          gh pr comment "$PR_NUMBER" --body "### Autonomous Repair\n\nRepair attempt **${ATTEMPT}/${MAX_ATTEMPTS}** committed to the same candidate branch.\n\nProvider: \`${PROVIDER}\`  \nModel: \`${MODEL}\`  \nOpenRouter reported cost: \`\$${OPENROUTER_COST}\`  \nDeepSeek reported cost: \`\$${DEEPSEEK_COST}\`\n\n${NEXT_TEXT}"

      - name: Dispatch fresh external review for repaired SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          TASK_PATH: ${{ github.event.client_payload.task_path }}
          ATTEMPT: ${{ github.event.client_payload.attempt }}
          REVIEW_TYPE: ${{ github.event.client_payload.review_type }}
          RISK_CLASS: ${{ github.event.client_payload.risk_class }}
          REVIEWER_SLOT: ${{ github.event.client_payload.reviewer_slot }}
        run: |
          set -euo pipefail
          NEXT_ROUND=$((ATTEMPT + 1))
          case "$REVIEW_TYPE" in CODE_REVIEW|PLC_REVIEW) ;; *) echo "Invalid external review type"; exit 1 ;; esac
          case "$RISK_CLASS" in LOW|MEDIUM|HIGH) ;; *) echo "Invalid external review risk class"; exit 1 ;; esac
          [[ "$REVIEWER_SLOT" =~ ^[A-Za-z0-9._-]+$ ]]
          python3 agents/runtime/reviewer-policy.py authorize-slot \
            --task-file "$RUNNER_TEMP/task.json" \
            --reviewer-slot "$REVIEWER_SLOT"

          jq -n \
            --argjson pr "$PR_NUMBER" \
            --arg task_path "$TASK_PATH" \
            --arg review_type "$REVIEW_TYPE" \
            --arg risk_class "$RISK_CLASS" \
            --arg reviewer_slot "$REVIEWER_SLOT" \
            --argjson review_round "$NEXT_ROUND" \
            '{event_type:"external-review-request",client_payload:{pr_number:$pr,task_path:$task_path,review_type:$review_type,risk_class:$risk_class,reviewer_slot:$reviewer_slot,review_round:$review_round}}' \
            > "$RUNNER_TEMP/next-dispatch.json"
          cat "$RUNNER_TEMP/next-dispatch.json"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input "$RUNNER_TEMP/next-dispatch.json"