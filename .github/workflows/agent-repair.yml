name: Autonomous Repair

on:
  repository_dispatch:
    types: [candidate-repair]

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: repair-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  repair:
    if: startsWith(github.event.client_payload.branch, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      candidate_sha: ${{ steps.context.outputs.candidate_sha }}
      trusted_main_sha: ${{ steps.context.outputs.trusted_main_sha }}
      task_path: ${{ steps.context.outputs.task_path }}
      task_sha256: ${{ steps.context.outputs.task_sha256 }}
      max_attempts: ${{ steps.context.outputs.max_attempts }}
      reviewer_slot: ${{ steps.context.outputs.reviewer_slot }}
    steps:
      - name: Checkout exact candidate without publication credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve immutable repair authority and helper chain
        id: context
        shell: bash
        env:
          BRANCH: ${{ github.event.client_payload.branch }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          TASK_PATH: ${{ github.event.client_payload.task_path }}
          TASK_SHA256: ${{ github.event.client_payload.task_sha256 }}
          BOUND_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
          ATTEMPT: ${{ github.event.client_payload.attempt }}
          REVIEW_SOURCE: ${{ github.event.client_payload.review_source }}
          REVIEW_TYPE: ${{ github.event.client_payload.review_type }}
          RISK_CLASS: ${{ github.event.client_payload.risk_class }}
          REVIEWER_SLOT: ${{ github.event.client_payload.reviewer_slot }}
        run: |
          set -euo pipefail
          test "$REVIEW_SOURCE" = "external-review"
          case "$BRANCH" in agent/*) ;; *) echo "Invalid repair branch"; exit 1 ;; esac
          case "$TASK_PATH" in tasks/*.json) ;; *) echo "Invalid task path"; exit 1 ;; esac
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BOUND_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TASK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

          git fetch --no-tags origin main "$BOUND_BASE_SHA"
          LIVE_MAIN_SHA=$(git rev-parse origin/main)
          test "$LIVE_MAIN_SHA" = "$BOUND_BASE_SHA" || {
            echo "Trusted main moved after external review: expected $BOUND_BASE_SHA got $LIVE_MAIN_SHA"
            exit 1
          }
          TRUSTED_MAIN_SHA="$BOUND_BASE_SHA"
          git show "$TRUSTED_MAIN_SHA:$TASK_PATH" > "$RUNNER_TEMP/task.json"
          jq -e '.id and .review.riskClass and .review.reviewType and .maxRepairAttempts and (.candidatePolicy.allowedPaths | type == "array" and length > 0)' "$RUNNER_TEMP/task.json" >/dev/null
          test "$(jq -r .review.riskClass "$RUNNER_TEMP/task.json")" = "$RISK_CLASS"
          test "$(jq -r .review.reviewType "$RUNNER_TEMP/task.json")" = "$REVIEW_TYPE"

          mkdir -p "$RUNNER_TEMP/trusted-runtime"
          for path in agents/runtime/run-coder.sh agents/runtime/build-coder-context.py agents/runtime/candidate-patch.py agents/runtime/reviewer-policy.py agents/runtime/review-authority.py; do
            git show "$TRUSTED_MAIN_SHA:$path" > "$RUNNER_TEMP/trusted-runtime/$(basename "$path")"
          done
          chmod +x "$RUNNER_TEMP/trusted-runtime/run-coder.sh" "$RUNNER_TEMP/trusted-runtime/candidate-patch.py" "$RUNNER_TEMP/trusted-runtime/review-authority.py"
          TASK_ID=$(jq -r .id "$RUNNER_TEMP/task.json")
          python3 "$RUNNER_TEMP/trusted-runtime/review-authority.py" verify-continuation \
            --bound-base-sha "$TRUSTED_MAIN_SHA" \
            --live-main-sha "$LIVE_MAIN_SHA" \
            --task-path "$TASK_PATH" \
            --task-sha256 "$TASK_SHA256" \
            --task-file "$RUNNER_TEMP/task.json" \
            --task-id "$TASK_ID"
          python3 "$RUNNER_TEMP/trusted-runtime/reviewer-policy.py" authorize-slot \
            --task-file "$RUNNER_TEMP/task.json" --reviewer-slot "$REVIEWER_SLOT"
          python3 "$RUNNER_TEMP/trusted-runtime/candidate-patch.py" validate-current \
            --task "$RUNNER_TEMP/task.json" --base "$TRUSTED_MAIN_SHA"

          MAX_ATTEMPTS=$(jq -r .maxRepairAttempts "$RUNNER_TEMP/task.json")
          [[ "$MAX_ATTEMPTS" =~ ^[0-9]+$ ]]
          [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ] || { echo "Repair budget exceeded"; exit 1; }

          cp "$RUNNER_TEMP/trusted-runtime/build-coder-context.py" agents/runtime/build-coder-context.py
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "trusted_main_sha=$TRUSTED_MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "task_path=$TASK_PATH" >> "$GITHUB_OUTPUT"
          echo "task_sha256=$TASK_SHA256" >> "$GITHUB_OUTPUT"
          echo "max_attempts=$MAX_ATTEMPTS" >> "$GITHUB_OUTPUT"
          echo "reviewer_slot=$REVIEWER_SLOT" >> "$GITHUB_OUTPUT"

      - name: Collect bounded repair evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json comments --jq '.comments[-8:][] | .body' > "$RUNNER_TEMP/reviewer-comments.txt" || true
          test -f "$RUNNER_TEMP/reviewer-comments.txt" || : > "$RUNNER_TEMP/reviewer-comments.txt"

      - name: Build repair prompt from trusted state
        shell: bash
        env:
          ATTEMPT: ${{ github.event.client_payload.attempt }}
          MAX_ATTEMPTS: ${{ steps.context.outputs.max_attempts }}
          TRUSTED_MAIN_SHA: ${{ steps.context.outputs.trusted_main_sha }}
        run: |
          set -euo pipefail
          git show "$TRUSTED_MAIN_SHA:agents/prompts/coder.md" > "$RUNNER_TEMP/repair-task.md"
          printf '\n\n' >> "$RUNNER_TEMP/repair-task.md"
          git show "$TRUSTED_MAIN_SHA:agents/prompts/repair.md" >> "$RUNNER_TEMP/repair-task.md"
          git diff --no-ext-diff --unified=80 "$TRUSTED_MAIN_SHA"...HEAD > "$RUNNER_TEMP/current-candidate.diff"
          {
            echo
            echo '# Repair state'
            echo "Repair attempt: $ATTEMPT of $MAX_ATTEMPTS"
            echo
            echo '# Trusted task specification'
            echo '```json'
            cat "$RUNNER_TEMP/task.json"
            echo '```'
            echo
            echo '# Current candidate diff'
            echo '```diff'
            cat "$RUNNER_TEMP/current-candidate.diff"
            echo '```'
            echo
            echo '# Recent reviewer comments'
            cat "$RUNNER_TEMP/reviewer-comments.txt"
          } >> "$RUNNER_TEMP/repair-task.md"

      - name: Require at least one coding provider
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ] && [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "Configure OPENROUTER_API_KEY and/or DEEPSEEK_API_KEY."
            exit 1
          fi

      - name: Install coding runtime
        shell: bash
        run: |
          npm install --global opencode-ai@1.18.31
          opencode --version
          opencode models deepseek | grep -F 'deepseek/deepseek-flash'

      - name: Run repair agent without publication authority
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          OPENROUTER_TIMEOUT_MINUTES: '30'
          DEEPSEEK_MODEL: deepseek-flash
          DEEPSEEK_TIMEOUT_MINUTES: '30'
          CODER_TRUSTED_GIT_REF: ${{ steps.context.outputs.trusted_main_sha }}
          CODER_TRUSTED_TASK_PATH: ${{ steps.context.outputs.task_path }}
        run: |
          bash "$RUNNER_TEMP/trusted-runtime/run-coder.sh" \
            "$RUNNER_TEMP/repair-task.md" \
            "$RUNNER_TEMP/repair-provider-audit.json"

      - name: Restore trusted helper path after candidate execution
        if: always()
        shell: bash
        env:
          TRUSTED_MAIN_SHA: ${{ steps.context.outputs.trusted_main_sha }}
        run: |
          git show "$TRUSTED_MAIN_SHA:agents/runtime/build-coder-context.py" > agents/runtime/build-coder-context.py

      - name: Deterministic Linux acceptance after repair
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/SiemensBackend.Tests/SiemensBackend.Tests.csproj --configuration Release
          rm -rf "$RUNNER_TEMP/motor-generated"
          dotnet run --project src/GeneratorCli/GeneratorCli.csproj --configuration Release -- examples/motor.json "$RUNNER_TEMP/motor-generated"
          test -f "$RUNNER_TEMP/motor-generated/UDT_Motor.scl"

          INPUT=$(jq -r '.generator.input // empty' "$RUNNER_TEMP/task.json")
          EXPECTED=$(jq -r '.generator.expectedArtifact // empty' "$RUNNER_TEMP/task.json")
          if [ -n "$INPUT" ] && [ -n "$EXPECTED" ]; then
            rm -rf "$RUNNER_TEMP/repaired-generated"
            dotnet run --project src/GeneratorCli/GeneratorCli.csproj --configuration Release -- "$INPUT" "$RUNNER_TEMP/repaired-generated"
            test -f "$RUNNER_TEMP/repaired-generated/$EXPECTED"
          fi

      - name: Prepare bounded repair patch
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/trusted-runtime/candidate-patch.py" prepare \
            --task "$RUNNER_TEMP/task.json" \
            --patch "$RUNNER_TEMP/repair.patch" \
            --manifest "$RUNNER_TEMP/repair-patch-manifest.json"

      - name: Upload bounded repair data
        uses: actions/upload-artifact@v4
        with:
          name: repair-patch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/repair.patch
            ${{ runner.temp }}/repair-patch-manifest.json
            ${{ runner.temp }}/repair-provider-audit.json
          if-no-files-found: error

  publish-repair:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Fresh exact candidate checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.repair.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download bounded repair data only
        uses: actions/download-artifact@v4
        with:
          name: repair-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/repair-patch

      - name: Resolve bound trusted publisher policy
        shell: bash
        env:
          TRUSTED_MAIN_SHA: ${{ needs.repair.outputs.trusted_main_sha }}
          TASK_PATH: ${{ needs.repair.outputs.task_path }}
          TASK_SHA256: ${{ needs.repair.outputs.task_sha256 }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TRUSTED_MAIN_SHA"
          LIVE_MAIN_SHA=$(git rev-parse origin/main)
          test "$LIVE_MAIN_SHA" = "$TRUSTED_MAIN_SHA" || {
            echo "Trusted main moved before repair publication: expected $TRUSTED_MAIN_SHA got $LIVE_MAIN_SHA"
            exit 1
          }
          git show "$TRUSTED_MAIN_SHA:$TASK_PATH" > "$RUNNER_TEMP/task.json"
          git show "$TRUSTED_MAIN_SHA:agents/runtime/candidate-patch.py" > "$RUNNER_TEMP/trusted-candidate-patch.py"
          git show "$TRUSTED_MAIN_SHA:agents/runtime/review-authority.py" > "$RUNNER_TEMP/trusted-review-authority.py"
          chmod +x "$RUNNER_TEMP/trusted-candidate-patch.py" "$RUNNER_TEMP/trusted-review-authority.py"
          TASK_ID=$(jq -r '.id // empty' "$RUNNER_TEMP/task.json")
          test -n "$TASK_ID"
          python3 "$RUNNER_TEMP/trusted-review-authority.py" verify-continuation \
            --bound-base-sha "$TRUSTED_MAIN_SHA" \
            --live-main-sha "$LIVE_MAIN_SHA" \
            --task-path "$TASK_PATH" \
            --task-sha256 "$TASK_SHA256" \
            --task-file "$RUNNER_TEMP/task.json" \
            --task-id "$TASK_ID"

      - name: Validate repair patch and final candidate scope
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.repair.outputs.candidate_sha }}
          TRUSTED_MAIN_SHA: ${{ needs.repair.outputs.trusted_main_sha }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/trusted-candidate-patch.py" apply \
            --task "$RUNNER_TEMP/task.json" \
            --patch "$RUNNER_TEMP/repair-patch/repair.patch" \
            --manifest "$RUNNER_TEMP/repair-patch/repair-patch-manifest.json" \
            --expected-head "$CANDIDATE_SHA" \
            --scope-base "$TRUSTED_MAIN_SHA"

      - name: Materialize and publish repair with atomic GitHub ref CAS
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.client_payload.branch }}
          CANDIDATE_SHA: ${{ needs.repair.outputs.candidate_sha }}
          TRUSTED_MAIN_SHA: ${{ needs.repair.outputs.trusted_main_sha }}
          ATTEMPT: ${{ github.event.client_payload.attempt }}
        run: |
          set -euo pipefail
          TASK_ID=$(jq -r .id "$RUNNER_TEMP/task.json")
          COMMIT_MESSAGE="Agent: repair ${TASK_ID} attempt ${ATTEMPT}"
          BASE_TREE_SHA=$(git rev-parse "$CANDIDATE_SHA^{tree}")
          LOCAL_TREE_SHA=$(git write-tree)
          printf '[]' > "$RUNNER_TEMP/tree-entries.json"

          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            case "$status" in
              D)
                BASE_META=$(git ls-tree "$CANDIDATE_SHA" -- "$path")
                test -n "$BASE_META"
                MODE=${BASE_META%% *}
                TYPE_REST=${BASE_META#* }
                TYPE=${TYPE_REST%% *}
                test "$TYPE" = "blob"
                jq --arg path "$path" --arg mode "$MODE" --arg type "$TYPE" \
                  '. + [{path:$path,mode:$mode,type:$type,sha:null}]' \
                  "$RUNNER_TEMP/tree-entries.json" > "$RUNNER_TEMP/tree-entries.next.json"
                ;;
              A|M)
                INDEX_META=$(git ls-files -s -- "$path")
                test -n "$INDEX_META"
                MODE=${INDEX_META%% *}
                case "$MODE" in 100644|100755) ;; *) echo "Unsupported staged mode: $MODE $path"; exit 1 ;; esac
                git show ":$path" | base64 -w0 | jq -Rs '{content:.,encoding:"base64"}' > "$RUNNER_TEMP/blob-request.json"
                BLOB_SHA=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
                  --input "$RUNNER_TEMP/blob-request.json" --jq .sha)
                [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]]
                jq --arg path "$path" --arg mode "$MODE" --arg sha "$BLOB_SHA" \
                  '. + [{path:$path,mode:$mode,type:"blob",sha:$sha}]' \
                  "$RUNNER_TEMP/tree-entries.json" > "$RUNNER_TEMP/tree-entries.next.json"
                ;;
              *) echo "Unsupported staged status: $status $path"; exit 1 ;;
            esac
            mv "$RUNNER_TEMP/tree-entries.next.json" "$RUNNER_TEMP/tree-entries.json"
          done < <(git diff --cached --name-status -z --no-renames "$CANDIDATE_SHA")

          test "$(jq 'length' "$RUNNER_TEMP/tree-entries.json")" -gt 0
          jq --arg base "$BASE_TREE_SHA" '{base_tree:$base,tree:.}' \
            "$RUNNER_TEMP/tree-entries.json" > "$RUNNER_TEMP/tree-request.json"
          TREE_SHA=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" \
            --input "$RUNNER_TEMP/tree-request.json" --jq .sha)
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TREE_SHA" = "$LOCAL_TREE_SHA" || {
            echo "Server tree differs from validated staged tree: local $LOCAL_TREE_SHA server $TREE_SHA"
            exit 1
          }

          jq -n --arg message "$COMMIT_MESSAGE" --arg tree "$TREE_SHA" --arg parent "$CANDIDATE_SHA" \
            '{message:$message,tree:$tree,parents:[$parent],author:{name:"tia-automation-agent",email:"tia-automation-agent@users.noreply.github.com"},committer:{name:"tia-automation-agent",email:"tia-automation-agent@users.noreply.github.com"}}' \
            > "$RUNNER_TEMP/commit-request.json"
          NEW_SHA=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" \
            --input "$RUNNER_TEMP/commit-request.json" --jq .sha)
          [[ "$NEW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$NEW_SHA" --jq .sha)" = "$NEW_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$NEW_SHA" --jq .tree.sha)" = "$TREE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$NEW_SHA" --jq '.parents[0].sha')" = "$CANDIDATE_SHA"

          # Diagnostic freshness checks happen after object materialization but
          # before the authoritative server-side compare-and-swap transaction.
          # Unreachable Git objects may exist if these checks fail; no ref moves.
          git fetch --no-tags origin main
          LIVE_MAIN_SHA=$(git rev-parse origin/main)
          test "$LIVE_MAIN_SHA" = "$TRUSTED_MAIN_SHA" || {
            echo "Trusted main moved before atomic repair publication: expected $TRUSTED_MAIN_SHA got $LIVE_MAIN_SHA"
            exit 1
          }
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test "$REMOTE_SHA" = "$CANDIDATE_SHA" || {
            echo "Candidate branch moved before atomic repair publication: expected $CANDIDATE_SHA got $REMOTE_SHA"
            exit 1
          }

          # GitHub GraphQL updateRefs is the ref-publication security boundary.
          # Both stale-ref conditions are checked server-side in one atomic
          # mutation. The Git Database operations above created objects only and
          # did not advance main or the candidate branch.
          REPOSITORY_ID=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .node_id)
          BRANCH_REF="refs/heads/$BRANCH"
          MUTATION='mutation($repositoryId:ID!,$mainBefore:GitObjectID!,$branchName:GitRefname!,$branchBefore:GitObjectID!,$branchAfter:GitObjectID!){updateRefs(input:{repositoryId:$repositoryId,refUpdates:[{name:"refs/heads/main",beforeOid:$mainBefore,afterOid:$mainBefore,force:false},{name:$branchName,beforeOid:$branchBefore,afterOid:$branchAfter,force:false}]}){clientMutationId}}'
          gh api graphql \
            -f query="$MUTATION" \
            -f repositoryId="$REPOSITORY_ID" \
            -f mainBefore="$TRUSTED_MAIN_SHA" \
            -f branchName="$BRANCH_REF" \
            -f branchBefore="$CANDIDATE_SHA" \
            -f branchAfter="$NEW_SHA" \
            > "$RUNNER_TEMP/update-refs-result.json"
          jq -e '.data.updateRefs' "$RUNNER_TEMP/update-refs-result.json" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$TRUSTED_MAIN_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$BRANCH" --jq .object.sha)" = "$NEW_SHA"
          echo "candidate_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

      - name: Record repair and dispatch fresh exact-SHA review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          TASK_PATH: ${{ needs.repair.outputs.task_path }}
          REVIEW_TYPE: ${{ github.event.client_payload.review_type }}
          RISK_CLASS: ${{ github.event.client_payload.risk_class }}
          REVIEWER_SLOT: ${{ needs.repair.outputs.reviewer_slot }}
          ATTEMPT: ${{ github.event.client_payload.attempt }}
          MAX_ATTEMPTS: ${{ needs.repair.outputs.max_attempts }}
          NEW_SHA: ${{ steps.push.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          PROVIDER=$(jq -r '.selected_provider // "unknown"' "$RUNNER_TEMP/repair-patch/repair-provider-audit.json")
          MODEL=$(jq -r '.selected_model // "unknown"' "$RUNNER_TEMP/repair-patch/repair-provider-audit.json")
          gh pr comment "$PR_NUMBER" --body "### Autonomous Repair\n\nRepair attempt **${ATTEMPT}/${MAX_ATTEMPTS}** was published by a fresh clean publisher. Candidate code did not run in the publication job.\n\nNew exact SHA: \`${NEW_SHA}\`\nProvider/model: \`${PROVIDER}\` / \`${MODEL}\`\n\nA fresh independent review is required before merge."
          NEXT_ROUND=$((ATTEMPT + 1))
          jq -n \
            --argjson pr "$PR_NUMBER" \
            --arg task_path "$TASK_PATH" \
            --arg review_type "$REVIEW_TYPE" \
            --arg risk_class "$RISK_CLASS" \
            --arg reviewer_slot "$REVIEWER_SLOT" \
            --argjson review_round "$NEXT_ROUND" \
            '{event_type:"external-review-request",client_payload:{pr_number:$pr,task_path:$task_path,review_type:$review_type,risk_class:$risk_class,reviewer_slot:$reviewer_slot,review_round:$review_round}}' \
            > "$RUNNER_TEMP/review-dispatch.json"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input "$RUNNER_TEMP/review-dispatch.json"
