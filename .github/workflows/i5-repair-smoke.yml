name: I5 Repair Smoke

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  seed-broken-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Create intentionally incomplete candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="agent/repair-smoke-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"

          cat > examples/valve.json <<'JSON'
          {
            "name": "Valve",
            "fields": [
              { "name": "Open", "type": "Bool" },
              { "name": "Close", "type": "Bool" },
              { "name": "Opened", "type": "Bool" },
              { "name": "Closed", "type": "Bool" }
            ]
          }
          JSON

          git config user.name "tia-automation-smoke"
          git config user.email "tia-automation-smoke@users.noreply.github.com"
          git add examples/valve.json
          git commit -m "Smoke: seed incomplete Valve candidate"
          gh auth setup-git
          git push --set-upstream origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Smoke: I5 bounded repair loop" \
            --body "Intentional infrastructure smoke candidate. The initial Valve is missing the required Fault field and generation test. Candidate Validation must reject it, Autonomous Repair must fix the same PR, and the fresh validation must reach TIA V21. Do not merge this PR.")
          PR_NUMBER=$(gh pr view "$BRANCH" --json number --jq '.number')
          CANDIDATE_SHA=$(git rev-parse HEAD)

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "$PR_URL"

      - name: Dispatch initial trusted candidate validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          jq -n \
            --argjson pr "$PR_NUMBER" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg branch "$BRANCH" \
            '{event_type:"candidate-validation",client_payload:{pr_number:$pr,candidate_sha:$candidate_sha,branch:$branch,task_path:"tasks/INFRA-001.json",attempt:0}}' \
            > "$RUNNER_TEMP/candidate-dispatch.json"
          cat "$RUNNER_TEMP/candidate-dispatch.json"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input "$RUNNER_TEMP/candidate-dispatch.json"
