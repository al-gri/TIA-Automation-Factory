name: External Review Response

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process-external-review:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/external-review')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Extract reviewer JSON
        id: response
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          body = os.environ['COMMENT_BODY']
          lines = body.splitlines()
          if not lines or lines[0].strip() != '/external-review':
              raise SystemExit('First line must be exactly /external-review')
          payload = '\n'.join(lines[1:]).strip()
          if payload.startswith('```'):
              fenced = payload.splitlines()
              if len(fenced) < 3 or not fenced[-1].strip().startswith('```'):
                  raise SystemExit('Malformed fenced JSON payload')
              payload = '\n'.join(fenced[1:-1]).strip()
          data = json.loads(payload)
          if not isinstance(data, dict):
              raise SystemExit('Reviewer payload must be a JSON object')
          request_id = data.get('reviewRequestId')
          if not isinstance(request_id, str) or not request_id:
              raise SystemExit('reviewRequestId is required')
          Path(os.environ['RUNNER_TEMP'], 'external-review-response.json').write_text(
              json.dumps(data, ensure_ascii=False), encoding='utf-8')
          Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8').write(f'request_id={request_id}\n')
          PY

      - name: Resolve trusted pending review state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REQUEST_ID: ${{ steps.response.outputs.request_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > "$RUNNER_TEMP/pr-comments.json"
          gh pr view "$PR_NUMBER" --json state,baseRefName,headRefOid,headRefName > "$RUNNER_TEMP/pr.json"
          test "$(jq -r .state "$RUNNER_TEMP/pr.json")" = "OPEN"
          test "$(jq -r .baseRefName "$RUNNER_TEMP/pr.json")" = "main"

          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          comments = json.loads(Path(os.environ['RUNNER_TEMP'], 'pr-comments.json').read_text(encoding='utf-8'))
          request_id = os.environ['REQUEST_ID']
          pattern = re.compile(r'<!-- external-review-state-v1\n(\{[^\n]+\})\n-->', re.M)
          matches = []
          for comment in comments:
              for raw in pattern.findall(comment.get('body') or ''):
                  try:
                      state = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if state.get('reviewRequestId') == request_id:
                      matches.append(state)
          if not matches:
              raise SystemExit(f'No trusted external review state found for {request_id}')
          state = matches[-1]
          if state.get('state') != 'WAITING_FOR_EXTERNAL_REVIEW':
              raise SystemExit(f"Review request is not pending: {state.get('state')}")

          required = [
              'baseSha', 'taskPath', 'taskSha256', 'taskId', 'candidateSha',
              'reviewType', 'reviewRound', 'reviewerSlot', 'riskClass'
          ]
          for key in required:
              if key not in state:
                  raise SystemExit(f'Missing trusted state field: {key}')

          pr = json.loads(Path(os.environ['RUNNER_TEMP'], 'pr.json').read_text(encoding='utf-8'))
          current_sha = pr['headRefOid']
          if state['candidateSha'].lower() != current_sha.lower():
              raise SystemExit('Stale external review: PR head changed after package generation')
          branch = pr['headRefName']
          if not isinstance(branch, str) or not branch.startswith('agent/'):
              raise SystemExit('External review automation only resumes trusted agent/* candidate branches')

          Path(os.environ['RUNNER_TEMP'], 'pending-review-state.json').write_text(
              json.dumps(state, sort_keys=True), encoding='utf-8')
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as fh:
              for key, output_name in [
                  ('baseSha','base_sha'), ('taskPath','task_path'), ('taskSha256','task_sha256'),
                  ('taskId','task_id'), ('candidateSha','candidate_sha'), ('reviewType','review_type'),
                  ('reviewRound','review_round'), ('reviewerSlot','reviewer_slot'), ('riskClass','risk_class')]:
                  fh.write(f'{output_name}={state[key]}\n')
              fh.write(f'branch={branch}\n')
          PY

          BASE_SHA=$(jq -r .baseSha "$RUNNER_TEMP/pending-review-state.json")
          CANDIDATE_SHA=$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")
          REVIEWER_SLOT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["reviewerSlot"])' "$RUNNER_TEMP/external-review-response.json")
          git fetch --no-tags origin main "$BASE_SHA" "$CANDIDATE_SHA"
          LIVE_MAIN_SHA=$(git rev-parse origin/main)
          test "$LIVE_MAIN_SHA" = "$BASE_SHA" || {
            echo "Trusted main moved after review package publication: expected $BASE_SHA got $LIVE_MAIN_SHA"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/trusted-review-authority"
          for path in agents/runtime/reviewer-policy.py agents/runtime/external-review.py agents/runtime/review-authority.py; do
            git show "$BASE_SHA:$path" > "$RUNNER_TEMP/trusted-review-authority/$(basename "$path")"
          done
          chmod +x "$RUNNER_TEMP/trusted-review-authority/"*.py

          git log --format='%ae' "$BASE_SHA..$CANDIDATE_SHA" > "$RUNNER_TEMP/candidate-author-emails.txt"
          test -s "$RUNNER_TEMP/candidate-author-emails.txt"
          python3 "$RUNNER_TEMP/trusted-review-authority/reviewer-policy.py" validate-slot \
            --emails-file "$RUNNER_TEMP/candidate-author-emails.txt" \
            --reviewer-slot "$REVIEWER_SLOT"

      - name: Validate and bind reviewer response
        shell: bash
        env:
          REQUEST_ID: ${{ steps.response.outputs.request_id }}
          REVIEWER_SLOT: ${{ steps.state.outputs.reviewer_slot }}
          TASK_ID: ${{ steps.state.outputs.task_id }}
          CANDIDATE_SHA: ${{ steps.state.outputs.candidate_sha }}
          REVIEW_TYPE: ${{ steps.state.outputs.review_type }}
          REVIEW_ROUND: ${{ steps.state.outputs.review_round }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/trusted-review-authority/external-review.py" validate-response \
            --input "$RUNNER_TEMP/external-review-response.json" \
            --request-id "$REQUEST_ID" \
            --reviewer-slot "$REVIEWER_SLOT" \
            --task-id "$TASK_ID" \
            --candidate-sha "$CANDIDATE_SHA" \
            --review-type "$REVIEW_TYPE" \
            --review-round "$REVIEW_ROUND" \
            --normalized-output "$RUNNER_TEMP/normalized-review.json"

      - name: Resolve current trusted task authorization and repair bound
        id: task
        shell: bash
        env:
          BASE_SHA: ${{ steps.state.outputs.base_sha }}
          TASK_PATH: ${{ steps.state.outputs.task_path }}
          TASK_SHA256: ${{ steps.state.outputs.task_sha256 }}
          TASK_ID: ${{ steps.state.outputs.task_id }}
          REVIEW_ROUND: ${{ steps.state.outputs.review_round }}
          RISK_CLASS: ${{ steps.state.outputs.risk_class }}
          REVIEW_TYPE: ${{ steps.state.outputs.review_type }}
          REVIEWER_SLOT: ${{ steps.state.outputs.reviewer_slot }}
        run: |
          set -euo pipefail
          case "$TASK_PATH" in tasks/*.json) ;; *) echo "Invalid bound task path"; exit 1 ;; esac
          git show "$BASE_SHA:$TASK_PATH" > "$RUNNER_TEMP/bound-task.json"
          python3 "$RUNNER_TEMP/trusted-review-authority/review-authority.py" validate \
            --state "$RUNNER_TEMP/pending-review-state.json" \
            --current-base-sha "$BASE_SHA" \
            --task-path "$TASK_PATH" \
            --task-file "$RUNNER_TEMP/bound-task.json"
          test "$(python3 "$RUNNER_TEMP/trusted-review-authority/review-authority.py" task-sha --task "$RUNNER_TEMP/bound-task.json")" = "$TASK_SHA256"
          test "$(jq -r .id "$RUNNER_TEMP/bound-task.json")" = "$TASK_ID"
          TASK_RISK=$(jq -r '.review.riskClass' "$RUNNER_TEMP/bound-task.json")
          TASK_REVIEW_TYPE=$(jq -r '.review.reviewType' "$RUNNER_TEMP/bound-task.json")
          test "$TASK_RISK" = "$RISK_CLASS"
          test "$TASK_REVIEW_TYPE" = "$REVIEW_TYPE"
          python3 "$RUNNER_TEMP/trusted-review-authority/reviewer-policy.py" authorize-slot \
            --task-file "$RUNNER_TEMP/bound-task.json" \
            --reviewer-slot "$REVIEWER_SLOT"
          MAX_REPAIRS=$(jq -r '.maxRepairAttempts // 0' "$RUNNER_TEMP/bound-task.json")
          [[ "$MAX_REPAIRS" =~ ^[0-9]+$ ]]
          [[ "$REVIEW_ROUND" =~ ^[1-9][0-9]*$ ]]
          echo "task_path=$TASK_PATH" >> "$GITHUB_OUTPUT"
          echo "max_repairs=$MAX_REPAIRS" >> "$GITHUB_OUTPUT"

      - name: Publish validated review state
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REQUEST_ID: ${{ steps.response.outputs.request_id }}
          REVIEWER_SLOT: ${{ steps.state.outputs.reviewer_slot }}
          BASE_SHA: ${{ steps.state.outputs.base_sha }}
          TASK_PATH: ${{ steps.state.outputs.task_path }}
          TASK_SHA256: ${{ steps.state.outputs.task_sha256 }}
          TASK_ID: ${{ steps.state.outputs.task_id }}
          CANDIDATE_SHA: ${{ steps.state.outputs.candidate_sha }}
          REVIEW_TYPE: ${{ steps.state.outputs.review_type }}
          REVIEW_ROUND: ${{ steps.state.outputs.review_round }}
          RISK_CLASS: ${{ steps.state.outputs.risk_class }}
        run: |
          set -euo pipefail
          STATUS=$(jq -r .reviewStatus "$RUNNER_TEMP/normalized-review.json")
          case "$STATUS" in
            APPROVE) NEW_STATE=APPROVED_EXTERNAL_REVIEW ;;
            CHANGES_REQUIRED) NEW_STATE=REVIEW_CHANGES_REQUIRED ;;
            BLOCKED) NEW_STATE=BLOCKED ;;
            *) echo "Unexpected validated status: $STATUS"; exit 1 ;;
          esac
          export NEW_STATE

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          state = {
              'protocolVersion': '1.0',
              'reviewRequestId': os.environ['REQUEST_ID'],
              'reviewerSlot': os.environ['REVIEWER_SLOT'],
              'baseSha': os.environ['BASE_SHA'],
              'taskPath': os.environ['TASK_PATH'],
              'taskSha256': os.environ['TASK_SHA256'],
              'taskId': os.environ['TASK_ID'],
              'candidateSha': os.environ['CANDIDATE_SHA'],
              'reviewType': os.environ['REVIEW_TYPE'],
              'reviewRound': int(os.environ['REVIEW_ROUND']),
              'riskClass': os.environ['RISK_CLASS'],
              'state': os.environ['NEW_STATE'],
          }
          normalized = Path(os.environ['RUNNER_TEMP'], 'normalized-review.json').read_text(encoding='utf-8')
          marker = '<!-- external-review-state-v1\n' + json.dumps(state, separators=(',', ':')) + '\n-->\n'
          body = marker + '### External review result\n\nValidated state: **' + os.environ['NEW_STATE'] + '**\n\n```json\n' + normalized + '```\n'
          Path(os.environ['RUNNER_TEMP'], 'review-result-comment.md').write_text(body, encoding='utf-8')
          PY

          # Final authority check occurs after comment construction and directly
          # before the privileged publication call.
          git fetch --no-tags origin main "$BASE_SHA"
          LIVE_MAIN_SHA=$(git rev-parse origin/main)
          python3 "$RUNNER_TEMP/trusted-review-authority/review-authority.py" verify-continuation \
            --bound-base-sha "$BASE_SHA" --live-main-sha "$LIVE_MAIN_SHA" \
            --task-path "$TASK_PATH" --task-sha256 "$TASK_SHA256" \
            --task-file "$RUNNER_TEMP/bound-task.json" --task-id "$TASK_ID"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/review-result-comment.md"
          echo "state=$NEW_STATE" >> "$GITHUB_OUTPUT"

      - name: Continue approved LOW/MEDIUM candidate to trusted validation
        if: steps.state.outputs.risk_class != 'HIGH' && steps.publish.outputs.state == 'APPROVED_EXTERNAL_REVIEW'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE_SHA: ${{ steps.state.outputs.candidate_sha }}
          BRANCH: ${{ steps.state.outputs.branch }}
          BASE_SHA: ${{ steps.state.outputs.base_sha }}
          TASK_PATH: ${{ steps.state.outputs.task_path }}
          TASK_SHA256: ${{ steps.state.outputs.task_sha256 }}
          TASK_ID: ${{ steps.state.outputs.task_id }}
          REVIEW_ROUND: ${{ steps.state.outputs.review_round }}
        run: |
          set -euo pipefail
          ATTEMPT=$((REVIEW_ROUND - 1))
          jq -n \
            --argjson pr "$PR_NUMBER" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg branch "$BRANCH" \
            --arg base_sha "$BASE_SHA" \
            --arg task_path "$TASK_PATH" \
            --arg task_sha256 "$TASK_SHA256" \
            --argjson attempt "$ATTEMPT" \
            '{event_type:"candidate-validation",client_payload:{pr_number:$pr,candidate_sha:$candidate_sha,branch:$branch,base_sha:$base_sha,task_path:$task_path,task_sha256:$task_sha256,attempt:$attempt}}' \
            > "$RUNNER_TEMP/approved-dispatch.json"

          git fetch --no-tags origin main "$BASE_SHA"
          LIVE_MAIN_SHA=$(git rev-parse origin/main)
          python3 "$RUNNER_TEMP/trusted-review-authority/review-authority.py" verify-continuation \
            --bound-base-sha "$BASE_SHA" --live-main-sha "$LIVE_MAIN_SHA" \
            --task-path "$TASK_PATH" --task-sha256 "$TASK_SHA256" \
            --task-file "$RUNNER_TEMP/bound-task.json" --task-id "$TASK_ID"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input "$RUNNER_TEMP/approved-dispatch.json"

          git fetch --no-tags origin main "$BASE_SHA"
          LIVE_MAIN_SHA=$(git rev-parse origin/main)
          python3 "$RUNNER_TEMP/trusted-review-authority/review-authority.py" verify-continuation \
            --bound-base-sha "$BASE_SHA" --live-main-sha "$LIVE_MAIN_SHA" \
            --task-path "$TASK_PATH" --task-sha256 "$TASK_SHA256" \
            --task-file "$RUNNER_TEMP/bound-task.json" --task-id "$TASK_ID"
          gh pr comment "$PR_NUMBER" --body "External review is **APPROVED**. Dispatched Linux-only Candidate Validation for candidate \`${CANDIDATE_SHA}\` bound to base \`${BASE_SHA}\`."

      - name: Record approved HIGH candidate for delegated merge decision
        if: steps.state.outputs.risk_class == 'HIGH' && steps.publish.outputs.state == 'APPROVED_EXTERNAL_REVIEW'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE_SHA: ${{ steps.state.outputs.candidate_sha }}
          BASE_SHA: ${{ steps.state.outputs.base_sha }}
          TASK_PATH: ${{ steps.state.outputs.task_path }}
          TASK_SHA256: ${{ steps.state.outputs.task_sha256 }}
          TASK_ID: ${{ steps.state.outputs.task_id }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/high-approval-comment.md" <<EOF
          HIGH-risk external review is **APPROVED** for exact candidate \`${CANDIDATE_SHA}\` and bound base \`${BASE_SHA}\`. No pre-merge Windows/TIA execution is dispatched. Connected ChatGPT may make the delegated technical merge decision only after re-verifying the current exact-SHA gates.
          EOF

          git fetch --no-tags origin main "$BASE_SHA"
          LIVE_MAIN_SHA=$(git rev-parse origin/main)
          python3 "$RUNNER_TEMP/trusted-review-authority/review-authority.py" verify-continuation \
            --bound-base-sha "$BASE_SHA" --live-main-sha "$LIVE_MAIN_SHA" \
            --task-path "$TASK_PATH" --task-sha256 "$TASK_SHA256" \
            --task-file "$RUNNER_TEMP/bound-task.json" --task-id "$TASK_ID"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/high-approval-comment.md"

      - name: Dispatch bounded repair after changes required
        if: steps.publish.outputs.state == 'REVIEW_CHANGES_REQUIRED'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CANDIDATE_SHA: ${{ steps.state.outputs.candidate_sha }}
          BRANCH: ${{ steps.state.outputs.branch }}
          BASE_SHA: ${{ steps.state.outputs.base_sha }}
          TASK_PATH: ${{ steps.state.outputs.task_path }}
          TASK_SHA256: ${{ steps.state.outputs.task_sha256 }}
          TASK_ID: ${{ steps.state.outputs.task_id }}
          REVIEW_TYPE: ${{ steps.state.outputs.review_type }}
          RISK_CLASS: ${{ steps.state.outputs.risk_class }}
          REVIEWER_SLOT: ${{ steps.state.outputs.reviewer_slot }}
          REVIEW_ROUND: ${{ steps.state.outputs.review_round }}
          MAX_REPAIRS: ${{ steps.task.outputs.max_repairs }}
        run: |
          set -euo pipefail
          REPAIR_ATTEMPT="$REVIEW_ROUND"
          if [ "$REPAIR_ATTEMPT" -gt "$MAX_REPAIRS" ]; then
            cat > "$RUNNER_TEMP/repair-blocked.md" <<EOF
          ### External review repair limit

          State: **BLOCKED**

          Requested repair attempt **${REPAIR_ATTEMPT}** exceeds trusted task limit **${MAX_REPAIRS}**. No repair was dispatched.
          EOF
            git fetch --no-tags origin main "$BASE_SHA"
            LIVE_MAIN_SHA=$(git rev-parse origin/main)
            python3 "$RUNNER_TEMP/trusted-review-authority/review-authority.py" verify-continuation \
              --bound-base-sha "$BASE_SHA" --live-main-sha "$LIVE_MAIN_SHA" \
              --task-path "$TASK_PATH" --task-sha256 "$TASK_SHA256" \
              --task-file "$RUNNER_TEMP/bound-task.json" --task-id "$TASK_ID"
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/repair-blocked.md"
            exit 0
          fi

          jq -n \
            --argjson pr "$PR_NUMBER" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg branch "$BRANCH" \
            --arg base_sha "$BASE_SHA" \
            --arg task_path "$TASK_PATH" \
            --arg task_sha256 "$TASK_SHA256" \
            --arg review_type "$REVIEW_TYPE" \
            --arg risk_class "$RISK_CLASS" \
            --arg reviewer_slot "$REVIEWER_SLOT" \
            --argjson attempt "$REPAIR_ATTEMPT" \
            '{event_type:"candidate-repair",client_payload:{review_source:"external-review",pr_number:$pr,candidate_sha:$candidate_sha,branch:$branch,base_sha:$base_sha,task_path:$task_path,task_sha256:$task_sha256,validation_run_id:0,attempt:$attempt,review_type:$review_type,risk_class:$risk_class,reviewer_slot:$reviewer_slot}}' \
            > "$RUNNER_TEMP/repair-dispatch.json"
          cat > "$RUNNER_TEMP/repair-dispatched-comment.md" <<EOF
          External review requires changes. Dispatched bounded repair attempt **${REPAIR_ATTEMPT}/${MAX_REPAIRS}** for candidate \`${CANDIDATE_SHA}\` bound to base \`${BASE_SHA}\`.
          EOF

          git fetch --no-tags origin main "$BASE_SHA"
          LIVE_MAIN_SHA=$(git rev-parse origin/main)
          python3 "$RUNNER_TEMP/trusted-review-authority/review-authority.py" verify-continuation \
            --bound-base-sha "$BASE_SHA" --live-main-sha "$LIVE_MAIN_SHA" \
            --task-path "$TASK_PATH" --task-sha256 "$TASK_SHA256" \
            --task-file "$RUNNER_TEMP/bound-task.json" --task-id "$TASK_ID"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input "$RUNNER_TEMP/repair-dispatch.json"

          git fetch --no-tags origin main "$BASE_SHA"
          LIVE_MAIN_SHA=$(git rev-parse origin/main)
          python3 "$RUNNER_TEMP/trusted-review-authority/review-authority.py" verify-continuation \
            --bound-base-sha "$BASE_SHA" --live-main-sha "$LIVE_MAIN_SHA" \
            --task-path "$TASK_PATH" --task-sha256 "$TASK_SHA256" \
            --task-file "$RUNNER_TEMP/bound-task.json" --task-id "$TASK_ID"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/repair-dispatched-comment.md"
