name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate trusted agent runtime scripts
        run: |
          bash -n agents/runtime/run-coder.sh
          python3 -m py_compile agents/runtime/build-coder-context.py
          python3 -m py_compile agents/runtime/candidate-patch.py
          python3 -m py_compile agents/runtime/review-authority.py
          python3 -m py_compile agents/runtime/reviewer-policy.py
          python3 -m py_compile agents/runtime/external-review.py
          python3 -m json.tool reviews/schemas/external-review-response.schema.json >/dev/null
      - name: Test coding-agent context bundle
        run: python3 -m unittest discover -s tests/AgentContext.Tests -p 'test_*.py' -v
      - name: Test external review protocol
        run: python3 -m unittest discover -s tests/ExternalReviewProtocol.Tests -p 'test_*.py' -v
      - name: Test factory isolation boundary
        run: python3 -m unittest discover -s tests/FactoryIsolation.Tests -p 'test_*.py' -v
      - name: Test Siemens backend
        run: dotnet test tests/SiemensBackend.Tests/SiemensBackend.Tests.csproj --configuration Release
      - name: Generate first Siemens artifact
        run: dotnet run --project src/GeneratorCli/GeneratorCli.csproj --configuration Release -- examples/motor.json artifacts/generated
      - name: Show generated SCL
        run: cat artifacts/generated/UDT_Motor.scl
      - uses: actions/upload-artifact@v4
        with:
          name: plc-generated
          path: artifacts/generated
