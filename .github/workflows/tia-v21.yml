name: TIA V21 Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tia-v21.yml'
      - 'src/TiaV21Worker/**'

jobs:
  verify-runner:
    runs-on: [self-hosted, Windows, X64, tia-v21]
    steps:
      - uses: actions/checkout@v4
      - name: Verify TIA Portal V21 installation
        shell: cmd
        run: |
          if not exist "C:\Program Files\Siemens\Automation\Portal V21" exit /b 1
          echo TIA Portal V21 installation found.
      - name: Verify Openness V21 assemblies
        shell: cmd
        run: |
          if not exist "C:\Program Files\Siemens\Automation\Portal V21\PublicAPI\V21\net48\Siemens.Engineering.Base.dll" exit /b 1
          if not exist "C:\Program Files\Siemens\Automation\Portal V21\PublicAPI\V21\net48\Siemens.Engineering.Step7.dll" exit /b 1
          echo Required Openness assemblies found.
      - name: Verify Siemens TIA Openness group membership
        shell: cmd
        run: |
          whoami /groups | findstr /I /C:"Siemens TIA Openness"
          if errorlevel 1 (
            echo Current runner user is not a member of Siemens TIA Openness.
            exit /b 1
          )
          echo Current runner user has Siemens TIA Openness group membership.
      - name: Verify .NET Framework 4.8 build prerequisites
        shell: cmd
        run: |
          dotnet --version
          if not exist "%ProgramFiles(x86)%\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8\mscorlib.dll" exit /b 1
          echo .NET Framework 4.8 reference assemblies found.
      - name: Build TiaV21Worker
        shell: cmd
        run: dotnet build src\TiaV21Worker\TiaV21Worker.csproj --configuration Release
      - name: Build completed
        shell: cmd
        run: echo TiaV21Worker compiled successfully. TIA Portal has not been started by this workflow.
