name: TIA V21 Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tia-v21.yml'

jobs:
  verify-runner:
    runs-on: [self-hosted, Windows, X64, tia-v21]
    steps:
      - uses: actions/checkout@v4
      - name: Verify TIA Portal V21 installation
        shell: cmd
        run: |
          if not exist "C:\Program Files\Siemens\Automation\Portal V21" (
            echo TIA Portal V21 was not found at C:\Program Files\Siemens\Automation\Portal V21
            exit /b 1
          )
          echo TIA Portal V21 installation found.
      - name: Verify Openness net48 assemblies
        shell: cmd
        run: |
          if not exist "C:\Program Files\Siemens\Automation\Portal V21\PublicAPI\V21\net48" (
            echo TIA Portal V21 Openness net48 API folder was not found.
            exit /b 1
          )
          dir "C:\Program Files\Siemens\Automation\Portal V21\PublicAPI\V21\net48"
      - name: Runner ready
        shell: cmd
        run: echo Windows runner is ready for the next milestone - real TIA Openness import and compile.
